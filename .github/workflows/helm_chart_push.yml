on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      env:
        required: true
        type: string
      helm-branch:
        required: true
        type: string
      network:
        required: false
        type: string
      helm-values-file:
        required: false
        type: string
    secrets:
      PAT_TOKEN:
        required: true

permissions:
  contents: write
  id-token: write
jobs:
  helm_chart_push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve helm chart target
        run: |
          # Target branch and values are passed in explicitly (no env parsing).
          echo "REPO=gnoswap-helm-charts"          >> "$GITHUB_ENV"
          echo "BRANCH=${{ inputs.helm-branch }}"  >> "$GITHUB_ENV"
          echo "CHART_PATH=${{ inputs.app-name }}" >> "$GITHUB_ENV"
          # Precedence: helm-values-file > values-<network>.yaml > values.yaml
          if [ -n "${{ inputs.helm-values-file }}" ]; then
            echo "VALUES_FILE=${{ inputs.helm-values-file }}"    >> "$GITHUB_ENV"
          elif [ -n "${{ inputs.network }}" ]; then
            echo "VALUES_FILE=values-${{ inputs.network }}.yaml" >> "$GITHUB_ENV"
          else
            echo "VALUES_FILE=values.yaml"                       >> "$GITHUB_ENV"
          fi

      - name: Clone helm chart repo
        run: |
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/gnoswap-labs/${REPO}.git helm-repo

      - name: Update image tag
        run: |
          cd helm-repo
          git checkout -b deploy-${{ github.run_id }}-${{ inputs.app-name }} origin/$BRANCH
          cd "$CHART_PATH"
          sed -i "s/^\(\s*tag\s*:\s*\).*/\1'${{ github.sha }}'/" "$VALUES_FILE"

      - name: Commit and push changes to helm repository
        run: |
          cd helm-repo
          git config --global user.email "gnoswap@onbloc.xyz"
          git config --global user.name "onbloc"
          git add .
          git commit -m "Pushed gnoswap-${{ inputs.app-name }}-${{ inputs.env }}:${{ github.sha }}"
          git push origin deploy-${{ github.run_id }}-${{ inputs.app-name }}
          git checkout $BRANCH
          git pull --rebase origin deploy-${{ github.run_id }}-${{ inputs.app-name }} || git rebase --abort
          git push origin $BRANCH
          git branch -d deploy-${{ github.run_id }}-${{ inputs.app-name }}
          git push origin --delete deploy-${{ github.run_id }}-${{ inputs.app-name }}
          echo "  ____                     _ "
          echo " |  _ \  ___  _ __   ___  | |"
          echo " | | | |/ _ \| '_ \ / _ \ | |"
          echo " | |_| | (_) | | | |  __/ |_|"
          echo " |____/ \___/|_| |_|\___| (_)"
